[package]
name = "zeevonk"
authors = ["Bauke Westendorp"]
description = "A new lighting control system server, that serves as a hub for lighting communication, processing and interaction."
license = "MIT OR Apache-2.0"
readme = "../../README.md"
documentation = "https://docs.rs/zeevonk"
repository = "https://github.com/BaukeWestendorp/zeevonk"
keywords = ["zeevonk", "lighting", "dmx", "sacn"]
categories = ["multimedia", "network-programming"]
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
theymx = { version = "0.1.1", features = ["serde"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
lazy_static = "1.5.0"
serde_json = "1.0.149"
spin_sleep = "1.3.3"
crossbeam-channel = "0.5.15"
libftd2xx = "0.33.1"
gdtf = "0.2.0"
arrayvec = "0.7.6"
socket2 = "0.6.1"
thread-priority = "3.0.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "fixture_count_scaling"
harness = false

[[bench]]
name = "attr_complexity"
harness = false

[[bench]]
name = "realistic"
harness = false
