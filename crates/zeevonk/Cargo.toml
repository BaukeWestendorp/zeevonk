[package]
name = "zeevonk"
authors = ["Bauke Westendorp"]
description = "A new lighting control system server, that serves as a hub for lighting communication, processing and interaction."
license = "MIT OR Apache-2.0"
readme = "../../README.md"
documentation = "https://docs.rs/zeevonk"
repository = "https://github.com/BaukeWestendorp/zeevonk"
keywords = ["zeevonk", "lighting", "dmx", "sacn"]
categories = ["multimedia", "network-programming"]
version.workspace = true
edition.workspace = true

[features]
server = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:spin_sleep",
    "dep:crossbeam-channel",
    "dep:libftd2xx",
    "dep:gdtf",
]
client-processor = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]
client-controller = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]

[dependencies]
log.workspace = true
theymx = { workspace = true, features = ["serde"] }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }

lazy_static = "1.5.0"
serde_json = "1.0.149"
tokio = { workspace = true, optional = true, features = ["sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.28.0", optional = true }

# feature = "server"
spin_sleep = { version = "1.3.3", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
libftd2xx = { version = "0.33.1", optional = true }
gdtf = { version = "0.2.0", optional = true }
tungstenite = { version = "0.28.0", optional = true }
futures-util = { version = "0.3.31", optional = true }

[dev-dependencies]
pretty_env_logger = "0.5.0"
