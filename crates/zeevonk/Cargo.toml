[package]
name = "zeevonk"
version.workspace = true
edition.workspace = true

[features]
default = []
server = ["dep:tokio", "dep:futures", "dep:tokio-tungstenite", "dep:crossbeam-channel", "dep:socket2", "dep:arrayvec", "dep:spin_sleep", "dep:gdtf"]
client = ["dep:reqwest"]

[dependencies]
log.workspace = true

thiserror = "2.0"

theymx = { version = "0.1.1", features = ["serde"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5.1"

uuid = { version = "1.19.0", features = ["serde", "v4"] }
lazy_static = "1.5.0"

tokio = { workspace = true, features = ["net", "time", "macros", "sync"], optional = true }
futures = { version = "0.3.31", default-features = false, optional = true }

# feature = "server"
spin_sleep = { version = "1.3.3", optional = true }
gdtf = { version = "0.2.0", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
socket2 = { version = "0.6.1", optional = true }
arrayvec = { version = "0.7.6", optional = true }
tokio-tungstenite = { version = "0.28.0", optional = true }

# feature = "client"
reqwest = { version = "0.13.1", optional = true, features = ["json"] }
